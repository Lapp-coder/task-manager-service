x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: :8080
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
  MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-20}
  MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-10}
  MYSQL_CONN_MAX_LIFETIME: ${MYSQL_CONN_MAX_LIFETIME:-30m}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_TIMEOUT: ${REDIS_TIMEOUT:-300ms}
  REDIS_BREAKER_FAILURES: ${REDIS_BREAKER_FAILURES:-5}
  REDIS_BREAKER_COOLDOWN: ${REDIS_BREAKER_COOLDOWN:-15s}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_TTL: ${JWT_TTL:-24h}
  CACHE_TASKS_TTL: ${CACHE_TASKS_TTL:-5m}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
  RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    image: task-manager-service:local
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy

  app:
    image: task-manager-service:local
    build: .
    environment: *app-env
    ports:
      - "${HTTP_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
